name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: unit-tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install locked dependencies
        run: uv sync --python ${{ matrix.python-version }} --locked --group dev

      - name: Run static checks
        run: uv run --python ${{ matrix.python-version }} --locked --group dev ruff check .

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} --locked --group dev pytest -q

      - name: Verify cache-only replay matches committed example
        run: |
          ./scripts/run --mode offline \
            --input tests/fixtures/input_90_days.json \
            --cache cache/new_input.jsonl \
            --output-dir "${RUNNER_TEMP}/fundo-offline-replay"
          cmp "${RUNNER_TEMP}/fundo-offline-replay/review_outcomes.json" reports/new_input/review_outcomes.json
          cmp "${RUNNER_TEMP}/fundo-offline-replay/credit_report.json" reports/new_input/credit_report.json
          cmp "${RUNNER_TEMP}/fundo-offline-replay/run_manifest.json" reports/new_input/run_manifest.json
