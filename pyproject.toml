[project]
name = "fundo-transaction-reviewer"
version = "0.1.0"
description = "Reproducible transaction-label reviewer for the Fundo AI Engineer take-home"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "openai>=2,<3",
    "pydantic>=2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.14,<1",
]

# `scripts/run` is the supported project launcher; the package is run as a module.

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
